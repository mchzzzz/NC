<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notas de crédito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3F6; --surface:#FFFFFF; --ink:#0C2F44; --ink2:#4F6B7C; --line:#D3E3EA;
  --deep:#0B4F6C; --water:#1BA3C6; --foam:#BFE9F4; --warm:#E59A2F; --hot:#D2553A; --ok:#2E9E6A;
  --chip:#DCEBF1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07202D; --surface:#0E2E3F; --ink:#E4F2F7; --ink2:#93B3C2; --line:#1C4458;
  --deep:#0A3E57; --water:#39C0E3; --foam:#15506A; --chip:#143B4F;}}
:root[data-theme="dark"]{--bg:#07202D; --surface:#0E2E3F; --ink:#E4F2F7; --ink2:#93B3C2; --line:#1C4458;
  --deep:#0A3E57; --water:#39C0E3; --foam:#15506A; --chip:#143B4F;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-bottom:40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:8px}
.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;background:var(--deep);color:#fff;padding:14px 18px 20px;overflow:hidden;border-radius:0 0 24px 24px}
.brand{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;opacity:.9}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em}
.upd{font-size:11px;opacity:.7;margin-top:2px}
.picker{margin-top:10px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 14px;width:100%;text-align:left;cursor:pointer}
.picker small{display:block;font-size:12px;opacity:.75}
.picker strong{font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:700}
.picker svg{margin-left:auto;flex:none}
.total{margin-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.total .lbl{font-size:13px;opacity:.8}
.total .amt{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:4px}
.total .amt span{font-size:18px;font-weight:600;opacity:.7;margin-right:4px}
.stats{display:flex;gap:16px;font-size:12px;opacity:.9;text-align:right;flex:none}
.stats b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;display:block}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:30px}
.wave path{fill:var(--bg)}
.wave .w2{fill:var(--water);opacity:.35}
@media (prefers-reduced-motion:no-preference){.wave .w2{animation:drift 9s ease-in-out infinite alternate}}
@keyframes drift{to{transform:translateX(-60px)}}

/* aging */
.aging{margin:-26px 16px 0;position:relative;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:0 6px 20px -12px rgba(11,79,108,.45)}
.aging h2{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--ink2)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--chip)}
.bar i{display:block;height:100%}
.leg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.leg div{font-size:12px;color:var(--ink2)}
.leg b{display:block;color:var(--ink);font-size:14px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:14px 16px 10px}
.tab{flex:1;border:0;background:transparent;padding:9px 0;border-radius:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tools{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:12px 0;outline:none;min-width:0}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
select{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 10px;margin-left:auto}

/* lists */
.list{padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.meta{font-size:12px;color:var(--ink2);padding:6px 16px 0}
.cli{background:var(--surface);border-radius:14px;border:1px solid var(--line)}
.cli>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:12px 14px;cursor:pointer}
.cli>button:focus-visible{outline:3px solid var(--water);border-radius:14px}
.cn{font-weight:600;font-size:14px;line-height:1.3;text-transform:capitalize}
.cs{font-size:12px;color:var(--ink2)}
.ca{grid-row:1/3;grid-column:2;text-align:right;align-self:center}
.ca b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;display:block}
.ca small{font-size:11px;font-weight:600}
.docs{border-top:1px dashed var(--line);padding:4px 14px 10px;display:none}
.cli.open .docs{display:block}
.doc{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.doc:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px;background:var(--chip);color:var(--deep)}
:root[data-theme="dark"] .tag{color:var(--water)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:var(--water)}}
.tag.F{background:#F7E3C2;color:#7A4A06}
.tag.N{background:#F5D3CB;color:#8A2A16}
.doc .d2{color:var(--ink2);font-size:12px}
.doc .am{text-align:right;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px}
.part{display:block;font-family:Figtree,sans-serif;font-size:11px;font-weight:600;color:var(--ok)}
.docrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.docrow .doc{border:0}
.more{margin:14px 16px 0;width:calc(100% - 32px);padding:12px;border-radius:12px;border:1px dashed var(--water);background:transparent;color:var(--water);font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--ink2);padding:40px 20px}

/* resumen */
.card{margin:10px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h3{margin:0 0 12px;font:700 16px "Bricolage Grotesque",sans-serif}
.days{display:flex;align-items:flex-end;gap:4px;height:130px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.days i{width:100%;background:var(--water);border-radius:4px 4px 0 0;min-height:2px}
.days span{font-size:10px;color:var(--ink2)}
.hb{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hb .t{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--deep)}
:root[data-theme="dark"] .hb .t i{background:var(--water)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hb .t i{background:var(--water)}}
.rank{all:unset;box-sizing:border-box;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.rank:last-child{border-bottom:0}
.rank .p{color:var(--ink2);font-size:12px;font-weight:700}
.rank b{font-family:"Bricolage Grotesque",sans-serif}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,20,30,.5);z-index:20;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;height:82%;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease,visibility 0s .25s;visibility:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet header{padding:10px 16px 8px}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 10px;font:700 18px "Bricolage Grotesque",sans-serif}
.vlist{overflow-y:auto;padding:0 16px 16px;flex:1}
.vopt{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.vopt[aria-current="true"]{color:var(--water);font-weight:700}
.vopt span:last-child{color:var(--ink2);font-size:13px}
</style>
</head>

<div class="wrap">
  <section class="hero">
    <div class="brand"><b>Notas de crédito</b><span id="corte"></span></div>
    <div class="upd">Actualizado: 20/10/2026 09:25</div>
    <button class="picker" id="openPicker" aria-haspopup="dialog">

    <div class="total">

    </div>

  <div class="tools" id="tools" style="padding-top:14px">

    </label>
    <div class="row">

      <button class="chip" data-k="B" aria-pressed="false">Boletas</button>
      <button class="chip" data-k="F" aria-pressed="false">Facturas</button>

        <option value="old">Más antiguo</option>
        <option value="new">Más reciente</option>
        <option value="name">Nombre A–Z</option>
      </select>
    </div>
  </div>
  <div class="meta" id="meta"></div>
  <div id="view"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">

  <div class="vlist" id="vlist"></div>
</div>

4,"BNH1-00000799",3.17,3.17,425],[2881,18,"BNH1-00000805",8.0,7.4,426],[2882,6,"BNH1-00000758",4.5,4.5,427],[2883,11,"FNH1-00000259",12.6,12.6,427],[2884,12,"BNH1-00000792",3.83,3.83,427],[2885,7,"BH01-00555529",1.27,1.27,428],[2886,7,"BH01-00555544",0.63,0.63,428],[2887,10,"BNH1-00000768",6.33,6.33,429],[2888,12,"BNH1-00000785",6.13,6.13,429],[2889,12,"BNH1-00000787",12.0,12.0,429],[2890,18,"BNH1-00000806",8.87,8.87,430],[2891,6,"BNH1-00000757",6.0,6.0,431],[2892,7,"BH01-00555762",1.27,1.27,432],[2893,5,"BNH1-00000744",18.0,18.0,433],[2875,3,"BNH1-00000723",19.0,19.0,434],[2894,5,"BNH1-00000741",10.6,10.6,434],[2895,3,"FNH1-00000248",3.53,3.53,435],[2896,5,"BNH1-00000747",15.2,15.2,435],[2897,3,"BNH1-00000731",3.7,3.7,436],[2898,5,"FNH1-00000251",5.64,5.64,436]]};
const BASE=new Date(D.base+'T00:00:00');
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const dateOf=o=>new Date(BASE.getTime()+o*864e5);
const fdate=o=>{const d=dateOf(o);return d.getDate()+' '+MESES[d.getMonth()]};
const money=n=>n.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const title=s=>esc(s.toLowerCase());
const CUT=Math.max(...D.r.map(r=>r[1]));
const typeOf=n=>n[0]==='F'?'F':n[0]==='B'?'B':'N';
const TYPENAME={B:'Boleta',F:'Factura',N:'Nota'};
// rows: {c,o,n,m,s,v,t,age}
const R=D.r.map(r=>({c:r[0],o:r[1],n:r[2],m:r[3],s:r[4],v:r[5],t:typeOf(r[2]),age:CUT-r[1]}));
const vTot=D.v.map(()=>({s:0,n:0}));R.forEach(r=>{vTot[r.v].s+=r.s;vTot[r.v].n++});

let st={v:-1,tab:'cli',q:'',k:'all',sort:'amt',limit:40,open:new Set()};
try{const sv=localStorage.getItem('nc_vend');if(sv!==null){const i=D.v.indexOf(sv);if(i>=0)st.v=i}}catch(e){}

const $=id=>document.getElementById(id);
$('corte').textContent='Corte '+fdate(CUT);

function scope(){return st.v<0?R:R.filter(r=>r.v===st.v)}
function filtered(rows){
  const q=st.q.trim().toLowerCase();
  return rows.filter(r=>{
    if(st.k==='B'&&r.t!=='B')return false;
    if(st.k==='F'&&r.t!=='F')return false;
    if(st.k==='old'&&r.age<=7)return false;
    if(q){const c=D.c[r.c];if(!(c[1].toLowerCase().includes(q)||c[0].includes(q)||r.n.toLowerCase().includes(q)||(st.v<0&&D.v[r.v].toLowerCase()===q)))return false}
    return true});
}
function ageColor(a){return a>7?'var(--hot)':a>3?'var(--warm)':'var(--water)'}

function header(){
  const rows=scope();
  const tot=rows.reduce((a,r)=>a+r.s,0);
  $('vname').textContent=st.v<0?'Todos ('+D.v.length+')':D.v[st.v];
  $('tot').innerHTML='<span>S/</span>'+money(tot);
  $('nDocs').textContent=rows.length.toLocaleString('es-PE');
  $('nCli').textContent=new Set(rows.map(r=>r.c)).size.toLocaleString('es-PE');
}

function docHTML(r,showCli){
  const c=D.c[r.c];
  const part=r.s<r.m-0.001?`<span class="part">Abono parcial · total S/ ${money(r.m)}</span>`:'';
  return `<div class="doc"><span class="tag ${r.t}">${TYPENAME[r.t]}</span>
    <div><div>${showCli?`<span class="cn">${title(c[1])}</span><br>`:''}${esc(r.n)}</div><div class="d2"><span class="dot" style="background:${ageColor(r.age)}"></span>${fdate(r.o)} · hace ${r.age} ${r.age===1?'día':'días'}${st.v<0?' · '+esc(D.v[r.v]):''}</div></div>
    <div class="am">${money(r.s)}${part}</div></div>`;
}

function renderCli(){
  const rows=filtered(scope());
  const g=new Map();
  rows.forEach(r=>{let x=g.get(r.c);if(!x){x={c:r.c,s:0,docs:[],min:99,max:-1};g.set(r.c,x)}x.s+=r.s;x.docs.push(r);x.min=Math.min(x.min,r.o);x.max=Math.max(x.max,r.o)});
  let arr=[...g.values()];
  const so={amt:(a,b)=>b.s-a.s,old:(a,b)=>a.min-b.min||b.s-a.s,new:(a,b)=>b.max-a.max||b.s-a.s,name:(a,b)=>D.c[a.c][1].localeCompare(D.c[b.c][1])}[st.sort];
  arr.sort(so);
  $('meta').textContent=arr.length+' clientes · S/ '+money(arr.reduce((a,x)=>a+x.s,0));
  if(!arr.length)return empty();
  const html=arr.slice(0,st.limit).map(x=>{
    const c=D.c[x.c];const age=CUT-x.min;const op=st.open.has(x.c);
    x.docs.sort((a,b)=>a.o-b.o);
    return `<div class="cli${op?' open':''}" data-c="${x.c}"><button aria-expanded="${op}">
      <span class="cn num" style="font-size:17px">${esc(c[0])}</span>
      <span class="ca"><b>${money(x.s)}</b><small style="color:${ageColor(age)}">${age} ${age===1?'día':'días'}</small></span>
      <span class="cs"><span style="text-transform:capitalize;color:var(--ink);font-weight:500">${title(c[1])}</span><br>${x.docs.length} ${x.docs.length===1?'documento':'documentos'}</span>
    </button><div class="docs">${x.docs.map(r=>docHTML(r,false)).join('')}</div></div>`}).join('');
  $('view').innerHTML=`<div class="list">${html}</div>`+(arr.length>st.limit?`<button class="more" id="more">Mostrar ${Math.min(40,arr.length-st.limit)} más de ${arr.length-st.limit}</button>`:'');
}
function renderDoc(){
  const rows=filtered(scope());
  const so={amt:(a,b)=>b.s-a.s,old:(a,b)=>a.o-b.o||b.s-a.s,new:(a,b)=>b.o-a.o||b.s-a.s,name:(a,b)=>D.c[a.c][1].localeCompare(D.c[b.c][1])}[st.sort];
  rows.sort(so);
  $('meta').textContent=rows.length+' documentos · S/ '+money(rows.reduce((a,r)=>a+r.s,0));
  if(!rows.length)return empty();
  $('view').innerHTML=`<div class="list">${rows.slice(0,st.limit).map(r=>`<div class="docrow">${docHTML(r,true)}</div>`).join('')}</div>`+(rows.length>st.limit?`<button class="more" id="more">Mostrar ${Math.min(40,rows.length-st.limit)} más de ${rows.length-st.limit}</button>`:'');
}
function renderRes(){
  const rows=scope();$('meta').textContent='';
  const days=[];for(let o=0;o<=CUT;o++)days.push({o,s:0});
  rows.forEach(r=>days[r.o].s+=r.s);
  const mx=Math.max(...days.map(d=>d.s),1);
  const types=['B','F','N'].map(t=>{const x=rows.filter(r=>r.t===t);return{t,n:x.length,s:x.reduce((a,r)=>a+r.s,0)}}).filter(x=>x.n);
  const tt=Math.max(...types.map(x=>x.s),1);
  const g=new Map();rows.forEach(r=>g.set(r.c,(g.get(r.c)||0)+r.s));
  const top=[...g.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
  let h=`<div class="card"><h3>Saldo por fecha de emisión</h3><div class="days">${days.map(d=>`<div title="${fdate(d.o)}: S/ ${money(d.s)}"><i style="height:${d.s/mx*100}%;background:${ageColor(CUT-d.o)}"></i><span>${dateOf(d.o).getDate()}</span></div>`).join('')}</div></div>
  <div class="card"><h3>Por tipo de documento</h3>${types.map(x=>`<div class="hb"><span>${TYPENAME[x.t]}s <span class="cs">(${x.n})</span></span><span class="t"><i style="width:${x.s/tt*100}%"></i></span><b class="num">S/ ${money(x.s)}</b></div>`).join('')}</div>
  <div class="card"><h3>Clientes con mayor saldo</h3>${top.map(([c,s],i)=>`<button class="rank" data-cq="${esc(D.c[c][0])}"><span class="p">${i+1}</span><span class="cn">${title(D.c[c][1])}</span><b>S/ ${money(s)}</b></button>`).join('')}</div>`;
  if(st.v<0){
    const tv=D.v.map((v,i)=>({i,v,...vTot[i]})).sort((a,b)=>b.s-a.s).slice(0,10);
    h+=`<div class="card"><h3>Vendedores con mayor saldo</h3>${tv.map((x,k)=>`<button class="rank" data-v="${x.i}"><span class="p">${k+1}</span><span>${esc(x.v)} <span class="cs">· ${x.n} doc.</span></span><b>S/ ${money(x.s)}</b></button>`).join('')}</div>`;
  }
  $('view').innerHTML=h;
}
function empty(){$('view').innerHTML=`<div class="empty">No hay resultados con estos filtros.<br>Prueba con otra búsqueda o toca «Todos».</div>`}
function render(){header();$('tools').style.display=st.tab==='res'?'none':'';({cli:renderCli,doc:renderDoc,res:renderRes})[st.tab]()}

// events
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.k=b.dataset.k;st.limit=40;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('sort').onchange=e=>{st.sort=e.target.value;render()};
let tq;$('q').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{st.q=e.target.value;st.limit=40;render()},150)};
$('view').addEventListener('click',e=>{
  const m=e.target.closest('#more');if(m){st.limit+=40;render();return}
  const rk=e.target.closest('.rank');
  if(rk){if(rk.dataset.v!==undefined)setV(+rk.dataset.v);else{st.q=rk.dataset.cq;$('q').value=st.q;st.tab='cli';document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.t==='cli'));render()}window.scrollTo({top:0});return}
  const cb=e.target.closest('.cli>button');
  if(cb){const el=cb.parentElement,c=+el.dataset.c;if(st.open.has(c))st.open.delete(c);else st.open.add(c);el.classList.toggle('open');cb.setAttribute('aria-expanded',el.classList.contains('open'))}
});
function setV(i){st.v=i;st.limit=40;st.open.clear();try{i<0?localStorage.removeItem('nc_vend'):localStorage.setItem('nc_vend',D.v[i])}catch(e){}closeSheet();render()}
function drawV(){
  const q=$('vq').value.trim().toLowerCase();
  const opts=[{i:-1,v:'Todos los vendedores',n:R.length}].concat(D.v.map((v,i)=>({i,v,n:vTot[i].n,s:vTot[i].s}))).filter(o=>!q||o.i<0||o.v.toLowerCase().includes(q));
  $('vlist').innerHTML=opts.map(o=>`<button class="vopt" data-i="${o.i}" aria-current="${o.i===st.v}"><span>${esc(o.v)}</span><span>${o.n} doc.${o.s!==undefined?' · S/ '+money(o.s):''}</span></button>`).join('');
}
function openSheet(){drawV();$('scrim').classList.add('on');$('sheet').classList.add('on');setTimeout(()=>$('vq').focus(),260)}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on')}
$('openPicker').onclick=openSheet;$('scrim').onclick=closeSheet;
$('vq').oninput=drawV;
$('vlist').onclick=e=>{const b=e.target.closest('.vopt');if(b)setV(+b.dataset.i)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
</script>
</body>
</html>
